<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fff8e7">
<title>天竜川くだり 飛竜くん</title>
<meta name="description" content="飛竜くんが天竜川を泳いでくだる、指で左右に動かすミニゲーム（試作）">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}
html{height:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 配置：上に「てんすう・ハート」の帯、その下いっぱいが天竜川。上から岩や流木が流れてくる。案内と結果は紙のカードで重ねる */
:root{
  --grass:#4f9a4a; --ink:#3a1a12; --dragon:#d8322a; --gold:#f6c343; --paper:#fff8e7;
  --display:"Dela Gothic One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:#1f4a2a;color:var(--ink);font-family:var(--body);font-weight:500;
  display:flex;justify-content:center;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--grass)}
.hud{display:flex;align-items:center;gap:8px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--paper);border-bottom:3px solid var(--ink)}
.sc{font-family:var(--display);font-size:22px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:96px}
.sc small{font-family:var(--body);font-weight:700;font-size:12px;margin-right:4px}
.hearts{flex:1;min-width:0;display:flex;justify-content:center;gap:4px;font-size:22px;line-height:1}
.hearts span{color:var(--dragon);text-shadow:0 1px 0 var(--ink)}
.hearts span.off{color:#d9cfc0;text-shadow:none}
.snd{font:700 12px var(--body);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:4px 8px;white-space:nowrap}
.pz{flex:none;width:36px;height:28px;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--gold);border:2px solid var(--ink);border-radius:8px;padding:0}
.pz i{width:5px;height:13px;background:var(--ink);border-radius:2px}
.pz:disabled{opacity:.35}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86%,340px);box-sizing:border-box;max-height:96%;overflow-y:auto;
  background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);
  padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:11px;text-align:center}
.card h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin:0;color:var(--dragon);text-wrap:balance}
.card h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;margin:0;color:var(--dragon)}
.card p{margin:0;font-size:15px;line-height:1.6}
.card p.legend{font-size:12px;font-weight:700;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;line-height:1.5}
.face{height:104px;width:auto}
.card p.msg{font-weight:700;font-size:19px;line-height:1.35;text-wrap:balance}
.card p.sub{font-size:13px;font-weight:700;white-space:pre-line}
.big{font-family:var(--display);font-size:44px;line-height:1;color:var(--dragon);font-variant-numeric:tabular-nums}
.big small{font-size:18px;margin-left:2px}
.rank{font-weight:700;font-size:17px;background:var(--gold);border:2px solid var(--ink);border-radius:999px;padding:2px 14px}
.btn{font:400 20px var(--display);color:#fff;background:var(--dragon);border:3px solid var(--ink);border-radius:14px;
  box-shadow:0 4px 0 var(--ink);padding:10px 22px;width:100%;display:block;box-sizing:border-box}
.btn.sub{background:#fff;color:var(--ink);font-size:16px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.snd:focus-visible,.pz:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.goal{position:absolute;left:12px;top:10px;font-size:13px;font-weight:700;color:#fff;background:rgba(20,40,60,.6);border-radius:999px;padding:3px 10px;pointer-events:none;font-variant-numeric:tabular-nums}
.goal b{color:var(--gold)}
.ladder{width:100%;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;box-sizing:border-box}
.ladder h3{margin:0 0 4px;font-size:14px;color:var(--dragon)}
.ladder ol{list-style:none;margin:0;padding:0;font-size:13px;font-weight:700;line-height:1.55}
.ladder li{display:flex;justify-content:space-between;gap:8px;padding:0 6px;border-radius:6px}
.ladder li span:last-child{font-variant-numeric:tabular-nums}
.ladder li.ok{color:#8a8fa8}
.ladder li.next{background:var(--gold)}
.ladder .bst{margin:4px 0 0;font-size:12px}
.lvup{position:absolute;right:12px;bottom:12px;font-family:var(--display);font-size:16px;color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:12px;padding:4px 12px;white-space:nowrap;pointer-events:none}
.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--display);font-size:22px;
  color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:999px;padding:4px 18px;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>

<div class="app">
  <div class="hud">
    <div class="sc"><small>てんすう</small><span id="score">0</span></div>
    <div class="hearts" id="hearts" aria-label="のこりハート"><span>♥</span><span>♥</span><span>♥</span></div>
    <button class="snd" id="snd" type="button">音あり</button>
    <button class="pz" id="pz" type="button" aria-label="一時停止" disabled><i></i><i></i></button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="goal" id="goal" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <div class="lvup" id="lvup" hidden></div>
    <div class="card" id="title">
      <h1>天竜川くだり</h1>
      <p>指を<b>左右に動かして</b>、<br>飛竜くんを泳がせよう！</p>
      <p class="legend">岩と流木にぶつかるとハートがへる（3つでおしまい）<br>アユをとると +10点、金のアユは +50点<br>うずまきに近づくと、すいこまれるよ</p>
      <div class="ladder"><h3>めざせ！</h3><ol id="ladder"></ol><p class="bst" id="tbest" hidden></p></div>
      <button class="btn" id="start" type="button">スタート</button>
    </div>
    <div class="card" id="pauseCard" hidden>
      <h2>ひとやすみ中</h2>
      <p>「つづける」を押すと、<br>3つ数えてから動き出すよ</p>
      <button class="btn" id="resume" type="button">つづける</button>
      <button class="btn sub" id="restart" type="button">さいしょから</button>
    </div>
    <div class="card" id="over" hidden>
      <img class="face" id="face" alt="" src="">
      <p class="msg" id="msg"></p>
      <div class="big"><span id="res">0</span><small>点</small></div>
      <div class="rank" id="rank"></div>
      <p class="sub" id="detail"></p>
      <p id="best">じこベスト 0点</p>
      <button class="btn" id="again" type="button">もういちど</button>
    </div>
  </div>
</div>

const RANK=["水あそび","川あそび","いかだ見習い","川くだり名人","天竜の船頭","天竜川の主","伝説の川くだり"];
const TIER=[0,200,500,900,1400,2000,2800];
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
try{best=parseInt(localStorage.getItem("tenryu-best"))||0}catch(e){}
const rnd=(a,b)=>a+Math.random()*(b-a);
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};

function fit(){const r=stage.getBoundingClientRect(),d=window.devicePixelRatio||1;
  if(r.width<10)return;
  scale=r.width/W;H=r.height/scale;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);
  ctx.setTransform(d*scale,0,0,d*scale,0,0)}
new ResizeObserver(fit).observe(stage);fit();

/* ---- 川の形（下流へ進むほど、少しずつ細くなる） ---- */
function rc(y){return W/2+52*Math.sin(y*0.0019)+22*Math.sin(y*0.0047+1.3)}
function rw(y){const n=Math.min(1,y/24000);return 270-80*n+26*Math.sin(y*0.0031+0.7)}
const bankL=y=>rc(y)-rw(y)/2, bankR=y=>rc(y)+rw(y)/2;
const w2s=wy=>H-(wy-S), s2w=sy=>S+(H-sy);
const DY=()=>H*0.68;

/* ---- 音 ---- */
function audio(){if(actx)return;try{actx=new (window.AudioContext||window.webkitAudioContext)();
  const b=actx.createBuffer(1,actx.sampleRate*1.5,actx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;noise=b}catch(e){}}
function beep(f,d,vol){if(!sound||!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();
  o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(vol||0.08,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function splash(v){if(!sound||!actx||!noise)return;try{const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain(),n=actx.currentTime;
  s.buffer=noise;f.type="bandpass";f.frequency.setValueAtTime(900,n);f.frequency.exponentialRampToValueAtTime(250,n+0.5);
  g.gain.setValueAtTime(0.45*v,n);g.gain.exponentialRampToValueAtTime(0.001,n+0.55);s.connect(f);f.connect(g);g.connect(actx.destination);s.start();s.stop(n+0.6)}catch(e){}}
function chime(){beep(880,0.09,0.06);setTimeout(()=>beep(1320,0.12,0.06),70)}

/* ---- 表示まわり ---- */
function toast(msg,ms){const el=$("toast");el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},ms||1600)}
function lvOf(s){let lv=0;for(let i=0;i<TIER.length;i++)if(s>=TIER[i])lv=i;return lv}
function goal(){const g=$("goal");if(state!=="play"){g.hidden=true;return}g.hidden=false;const lv=lvOf(score);
  if(lv>=TIER.length-1)g.innerHTML="<b>伝説の川くだり</b> たっせい！";else g.innerHTML="<b>"+RANK[lv+1]+"</b>まで あと "+(TIER[lv+1]-score)+"点";
  if(lv>curLv){curLv=lv;const u=$("lvup");u.textContent=RANK[lv]+" に なった！";u.hidden=false;clearTimeout(u.t);u.t=setTimeout(()=>{u.hidden=true},1800)}}
function ladder(){const nx=lvOf(best)+1;let h="";for(let i=1;i<TIER.length;i++)h+='<li class="'+(i<nx?"ok":i===nx?"next":"")+'"><span>'+(i<nx?"✓ ":"")+RANK[i]+"</span><span>"+TIER[i]+"点</span></li>";
  $("ladder").innerHTML=h;const b=$("tbest");if(best>0){b.hidden=false;b.textContent="じこベスト "+best+"点"+(nx<TIER.length?"（つぎは "+RANK[nx]+"）":"")}}
function hud(){$("score").textContent=score;const hs=$("hearts").children;for(let i=0;i<MAXH;i++)hs[i].className=i<hearts?"":"off";goal()}
function pb(){$("pz").disabled=state!=="play"}
function pop(x,y,txt,col,size){pops.push({x:Math.max(40,Math.min(W-40,x)),y,txt,col,size:size||18,l:1})}
function spray(x,y,n,col,sp){for(let i=0;i<(reduce?n/2:n);i++){const a=rnd(0,Math.PI*2),s=rnd(40,sp||160);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,l:rnd(0.4,0.8),L:0.8,c:col,r:rnd(1.5,3.5)})}}

/* ---- 流れてくる物を置く（上の見えない所に足していく） ---- */
function spawn(){const top=S+H+80,lvl=Math.min(1,S/30000);
  while(nextObs<top){const y=nextObs,lo=Math.max(bankL(y),6)+24,hi=Math.min(bankR(y),W-6)-24;
    if(S>1200&&Math.random()<0.28+0.15*lvl){const len=rnd(70,105),side=Math.random()<0.5,x=side?lo+len/2-10:hi-len/2+10;
      obs.push({k:"log",x,y,len,a:rnd(-0.3,0.3),vx:(side?1:-1)*rnd(6,26)*(0.4+lvl)})}
    else{const n=(S>3500&&Math.random()<0.3+0.3*lvl)?2:1,mid=(lo+hi)/2;
      for(let i=0;i<n;i++){const r=rnd(15,23),x=n===2?(i===0?rnd(lo,mid-34):rnd(mid+34,hi)):rnd(lo,hi);
        obs.push({k:"rock",x,y:y+rnd(-18,18),r,s:Math.random()*9})}}
    if(S>5000&&Math.random()<0.1+0.12*lvl){const yy=y+70;obs.push({k:"uzu",x:rnd(Math.max(bankL(yy),6)+40,Math.min(bankR(yy),W-6)-40),y:yy,r:30})}
    nextObs+=Math.max(140,250-110*lvl)*rnd(0.85,1.2)}
  while(nextFish<top){const y=nextFish,n=Math.floor(rnd(3,6)),lo=Math.max(bankL(y),6)+26,hi=Math.min(bankR(y),W-6)-26,x0=rnd(lo,hi),g=Math.random()<0.12;
    for(let i=0;i<(g?1:n);i++){const fy=y+i*30,fx=Math.max(lo,Math.min(hi,x0+Math.sin(i*0.9)*28));
      if(!obs.some(o=>o.k!=="uzu"&&Math.hypot(o.x-fx,o.y-fy)<(o.k==="log"?o.len/2+16:o.r+20)))fish.push({x:fx,y:fy,g,p:Math.random()*6})}
    nextFish+=rnd(240,400)}
  if(hearts<MAXH&&S>nextItem){const y=top,x=rnd(Math.max(bankL(y),6)+30,Math.min(bankR(y),W-6)-30);
    if(!obs.some(o=>Math.hypot(o.x-x,o.y-y)<50))items.push({x,y});nextItem=S+rnd(5000,8000)}}

function hit(){if(inv>0||god)return;hearts--;inv=1.6;shake=0.3;spray(dx,DY()-6,22,"#ffffff",200);splash(1);beep(150,0.25,0.1);
  pop(dx,DY()-50,"ゴツン！","#ffffff",22);
  if(hearts<=0){state="sink";pb();endT=t+1.4;toast("ザブーン！",1400)}
  hud()}

/* ---- 1コマすすめる ---- */
function step(dt){t+=dt;
  if(state==="play"){pt+=dt;v=140+Math.min(200,pt*2.2)}else if(state==="sink")v=Math.max(0,v-260*dt);else v=60;
  S+=v*dt;
  if(state==="play"||state==="sink"){
    if(state==="play")spawn();
    const px=dx;
    if(state==="play"){if(keyDir){tx=null;dx+=keyDir*330*dt}else if(tx!==null){const d=tx-dx;dx+=Math.sign(d)*Math.min(Math.abs(d),540*dt)}}
    for(const o of obs)if(o.k==="uzu"){const sy=w2s(o.y),d=Math.hypot(o.x-dx,sy-DY());if(d<o.r*2.6&&state==="play"){dx+=(o.x-dx)*1.6*dt}}
    const wy=s2w(DY()),L=Math.max(bankL(wy),4)+18,R=Math.min(bankR(wy),W-4)-18;
    if(dx<L){dx=L;if(Math.random()<0.3)spray(dx-14,DY(),2,"#ffffff",60)}if(dx>R){dx=R;if(Math.random()<0.3)spray(dx+14,DY(),2,"#ffffff",60)}
    dvx=dx-px;if(Math.abs(dvx)>0.4)face=dvx>0?1:-1;
    if(state==="play"){
      const hy=DY()-6;
      for(const o of obs){const sy=w2s(o.y);if(Math.abs(sy-hy)>80)continue;
        if(o.k==="rock"&&Math.hypot(o.x-dx,sy-hy)<o.r+9)hit();
        else if(o.k==="log"){const c=Math.cos(o.a)*o.len/2,s=Math.sin(o.a)*o.len/2,ax=o.x-c,ay=sy-s,bx=o.x+c,by=sy+s;
          const k=Math.max(0,Math.min(1,((dx-ax)*(bx-ax)+(hy-ay)*(by-ay))/((bx-ax)**2+(by-ay)**2)));
          if(Math.hypot(dx-(ax+k*(bx-ax)),hy-(ay+k*(by-ay)))<11+9)hit()}}
      for(let i=fish.length-1;i>=0;i--){const f=fish[i],sy=w2s(f.y);if(Math.hypot(f.x-dx,sy-hy)<24){fish.splice(i,1);ayu++;
        const p=f.g?50:10;if(f.g)goldN++;fishPts+=p;chime();spray(f.x,sy,f.g?18:8,f.g?"#ffd36b":"#e8f6ff",120);pop(f.x,sy-20,"+"+p,f.g?"#ffd36b":"#ffffff",f.g?24:18)}}
      for(let i=items.length-1;i>=0;i--){const it=items[i],sy=w2s(it.y);if(Math.hypot(it.x-dx,sy-hy)<26){items.splice(i,1);if(hearts<MAXH)hearts++;
        beep(392,0.22,0.1);setTimeout(()=>beep(523,0.22,0.1),130);setTimeout(()=>beep(784,0.4,0.1),260);pop(it.x,sy-20,"ハート +1","#ff8a8a",18);spray(it.x,sy,12,"#ff9a9a",120)}}
      score=Math.floor(S/PX)+fishPts;hud()}
    if(inv>0)inv-=dt;
  }
  if(state==="sink"){sinkY+=dt;if(t>=endT)end()}
  trail.unshift(dx);if(trail.length>40)trail.length=40;
  for(const o of obs)if(o.k==="log"){o.x+=o.vx*dt;const L=Math.max(bankL(o.y),0)+o.len/2-14,R=Math.min(bankR(o.y),W)-o.len/2+14;if(o.x<L){o.x=L;o.vx=Math.abs(o.vx)}if(o.x>R){o.x=R;o.vx=-Math.abs(o.vx)}}
  obs=obs.filter(o=>w2s(o.y)<H+90);fish=fish.filter(f=>w2s(f.y)<H+40);items=items.filter(i=>w2s(i.y)<H+40);
  if(Math.random()<(reduce?0.2:0.6)){const y=s2w(rnd(-20,H));streaks.push({x:rnd(Math.max(bankL(y),0)+10,Math.min(bankR(y),W)-10),y,l:1})}
  for(const s of streaks){s.l-=dt*0.7;s.y-=v*0.25*dt}streaks=streaks.filter(s=>s.l>0);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
  for(const p of pops){p.y-=36*dt;p.l-=dt*0.9}pops=pops.filter(p=>p.l>0);
  if(shake>0)shake-=dt}

/* ---- 描く ---- */
function riverPath(off){ctx.beginPath();const st=10;
  for(let sy=-st;sy<=H+st;sy+=st){const wy=s2w(sy),x=bankL(wy)-off;sy===-st?ctx.moveTo(x,sy):ctx.lineTo(x,sy)}
  for(let sy=H+st;sy>=-st;sy-=st)ctx.lineTo(bankR(s2w(sy))+off,sy);ctx.closePath()}
function tree(x,y,r){ctx.fillStyle="rgba(0,0,0,.15)";ctx.beginPath();ctx.ellipse(x+4,y+5,r,r*0.8,0,0,7);ctx.fill();
  ctx.fillStyle="#2f6f35";ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.fillStyle="#3f8a44";ctx.beginPath();ctx.arc(x-r*0.3,y-r*0.3,r*0.6,0,7);ctx.fill()}
function bridge(sy){ctx.save();ctx.globalAlpha=0.45;ctx.fillStyle="rgba(0,0,0,.18)";ctx.fillRect(0,sy+16,W,16);
  ctx.fillStyle="#9aa0a8";ctx.fillRect(0,sy-12,W,24);ctx.fillStyle="#6d737c";ctx.fillRect(0,sy-12,W,4);ctx.fillRect(0,sy+8,W,4);
  ctx.strokeStyle="#c8322a";ctx.lineWidth=3;ctx.beginPath();for(let x=-20;x<W+20;x+=24){ctx.moveTo(x,sy-12);ctx.lineTo(x+12,sy+12);ctx.lineTo(x+24,sy-12)}ctx.stroke();ctx.restore()}
function draw(){ctx.save();if(shake>0)ctx.translate(rnd(-4,4)*shake/0.3,rnd(-4,4)*shake/0.3);
  ctx.fillStyle="#4f9a4a";ctx.fillRect(-10,-10,W+20,H+20);
  // 岸の木（場所は川の位置から決まるので、流れても同じ所にある）
  const k0=Math.floor(s2w(H+40)/70),k1=Math.ceil(s2w(-40)/70);
  for(let k=k0;k<=k1;k++){const wy=k*70,sy=w2s(wy);
    const lx=bankL(wy)-26-hash(k)*60,rx=bankR(wy)+26+hash(k+99)*60;
    if(lx>-20)tree(lx,sy,12+hash(k+7)*8);if(rx<W+20)tree(rx,sy+30,12+hash(k+13)*8)}
  ctx.fillStyle="#e6d39a";riverPath(9);ctx.fill();
  const gr=ctx.createLinearGradient(0,0,W,0);gr.addColorStop(0,"#2c86b4");gr.addColorStop(0.5,"#3aa3cf");gr.addColorStop(1,"#2c86b4");
  ctx.fillStyle=gr;riverPath(0);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=2;ctx.lineCap="round";
  for(const s of streaks){const sy=w2s(s.y);ctx.globalAlpha=Math.min(1,s.l*2)*0.6;ctx.beginPath();ctx.moveTo(s.x,sy);ctx.lineTo(s.x,sy+14);ctx.stroke()}
  ctx.globalAlpha=1;
  for(const o of obs){const sy=w2s(o.y);
    if(o.k==="uzu"){ctx.save();ctx.translate(o.x,sy);ctx.rotate(-t*3);ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=3;
      for(let j=0;j<3;j++){ctx.beginPath();for(let a=0;a<5;a+=0.2){const r=4+a*5.5;ctx.lineTo(Math.cos(a+j*2.1)*r,Math.sin(a+j*2.1)*r*0.8)}ctx.stroke()}ctx.restore()}}
  for(const o of obs){const sy=w2s(o.y);
    if(o.k==="rock"){ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(o.x,sy+3,o.r+5,o.r+3,0,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
      ctx.fillStyle="#7d8087";ctx.strokeStyle="#3a1a12";ctx.lineWidth=2;ctx.beginPath();
      for(let a=0;a<6.28;a+=0.7){const rr=o.r*(0.85+0.15*Math.sin(a*3+o.s));ctx.lineTo(o.x+Math.cos(a)*rr,sy+Math.sin(a)*rr*0.85)}
      ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle="#a9adb4";ctx.beginPath();ctx.ellipse(o.x-o.r*0.3,sy-o.r*0.3,o.r*0.35,o.r*0.22,-0.5,0,7);ctx.fill()}
    else if(o.k==="log"){ctx.save();ctx.translate(o.x,sy);ctx.rotate(o.a);
      ctx.fillStyle="rgba(255,255,255,.35)";ctx.fillRect(-o.len/2-4,-14,o.len+8,4);
      ctx.fillStyle="#8b5a2b";ctx.strokeStyle="#3a1a12";ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-o.len/2,-10,o.len,20,9);ctx.fill();ctx.stroke();
      ctx.strokeStyle="#6b4220";ctx.beginPath();ctx.moveTo(-o.len/2+12,-3);ctx.lineTo(o.len/2-20,-3);ctx.moveTo(-o.len/2+24,4);ctx.lineTo(o.len/2-10,4);ctx.stroke();
      ctx.fillStyle="#d2a466";ctx.beginPath();ctx.ellipse(o.len/2-3,0,5,9,0,0,7);ctx.fill();ctx.stroke();ctx.restore()}}
  for(const f of fish){const sy=w2s(f.y),w=Math.sin(t*10+f.p)*0.25;ctx.save();ctx.translate(f.x,sy);ctx.rotate(w);
    if(f.g){ctx.shadowColor="#ffd36b";ctx.shadowBlur=14}
    ctx.fillStyle=f.g?"#ffd36b":"#dfeef3";ctx.strokeStyle="#3a1a12";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(0,0,6,13,0,0,7);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    ctx.beginPath();ctx.moveTo(0,11);ctx.lineTo(-6,20);ctx.lineTo(6,20);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle=f.g?"#e0a020":"#7c98a3";ctx.beginPath();ctx.ellipse(0,-1,2.5,9,0,0,7);ctx.fill();
    ctx.fillStyle="#3a1a12";ctx.beginPath();ctx.arc(-2.5,-8,1.3,0,7);ctx.arc(2.5,-8,1.3,0,7);ctx.fill();ctx.restore()}
  for(const it of items){const sy=w2s(it.y)+Math.sin(t*4)*3;ctx.fillStyle="#3f8a44";ctx.beginPath();ctx.ellipse(it.x,sy+4,16,9,0,0,7);ctx.fill();
    ctx.font="22px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineWidth=4;ctx.strokeStyle="#fff";ctx.strokeText("♥",it.x,sy);ctx.fillStyle="#e23b3b";ctx.fillText("♥",it.x,sy)}
  drawDragon();
  const b0=Math.floor(s2w(H+40)/2600),b1=Math.floor(s2w(-40)/2600);for(let k=b0;k<=b1;k++){const wy=k*2600+1300;const sy=w2s(wy);if(sy>-30&&sy<H+30)bridge(sy)}
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l/p.L);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.min(1,p.l*2);ctx.font=p.size+"px 'Dela Gothic One',sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.lineWidth=4;ctx.strokeStyle="#3a1a12";ctx.strokeText(p.txt,p.x,p.y);ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y)}ctx.globalAlpha=1;
  if(inv>1.2&&state==="play"){ctx.fillStyle="rgba(216,50,42,"+((inv-1.2)*0.6)+")";ctx.fillRect(0,0,W,H)}
  ctx.restore()}
function drawDragon(){if(state==="over")return;const y0=DY()+sinkY*40,blink=inv>0&&Math.floor(t*12)%2===0;
  const RED="#d8322a",DK="#b3241f",INK="#3a1a12",GOLD="#f6c343";
  ctx.save();if(state==="sink")ctx.globalAlpha=Math.max(0,1-sinkY*0.7);else if(blink)ctx.globalAlpha=0.4;
  ctx.lineJoin="round";ctx.lineCap="round";
  // 水のあと（頭の両わきから後ろへ広がる波）
  ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(dx-22,y0-8);ctx.quadraticCurveTo(dx-34,y0+14,dx-40,y0+40);ctx.moveTo(dx+22,y0-8);ctx.quadraticCurveTo(dx+34,y0+14,dx+40,y0+40);ctx.stroke();
  const N=10,seg=[];
  for(let i=1;i<=N;i++){const x=(trail[Math.min(trail.length-1,i*3)]??dx)+Math.sin(t*7-i*0.8)*4*(0.3+i/N),y=y0+6+i*12,r=Math.max(5,16.5-i*1.15);seg.push({x,y,r})}
  // 足（上から見た4本。水をかくように前後にゆれる）
  for(const [k,ph] of [[1,0],[5,Math.PI]]){const s=seg[k],sw=Math.sin(t*9+ph)*0.5;
    for(const sd of [-1,1]){ctx.save();ctx.translate(s.x+sd*(s.r-2),s.y);ctx.rotate(sd*(0.9+sw));
      ctx.fillStyle=RED;ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,-9,5,10,0,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle="#fff3d6";for(const c of [-3.5,0,3.5]){ctx.beginPath();ctx.moveTo(c-1.8,-17);ctx.lineTo(c,-23);ctx.lineTo(c+1.8,-17);ctx.closePath();ctx.fill();ctx.stroke()}
      ctx.restore()}}
  // しっぽの先
  {const a=seg[N-1],b=seg[N-2],an=Math.atan2(a.y-b.y,a.x-b.x);ctx.save();ctx.translate(a.x,a.y);ctx.rotate(an-Math.PI/2);
    ctx.fillStyle="#f3a9a9";ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,2);ctx.quadraticCurveTo(-11,10,0,24);ctx.quadraticCurveTo(11,10,0,2);ctx.fill();ctx.stroke();ctx.restore()}
  // 体（後ろから順に重ねる）と、背中の金のとげ
  for(let i=N-1;i>=0;i--){const s=seg[i];ctx.fillStyle=RED;ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();ctx.stroke();
    ctx.strokeStyle=DK;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(s.x,s.y,s.r*0.62,Math.PI*0.15,Math.PI*0.85);ctx.stroke()}
  for(let i=N-1;i>=0;i--){const s=seg[i],w=Math.max(2.2,s.r*0.36);ctx.fillStyle=GOLD;ctx.strokeStyle=INK;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(s.x,s.y-w*1.5);ctx.lineTo(s.x+w,s.y);ctx.lineTo(s.x,s.y+w*1.5);ctx.lineTo(s.x-w,s.y);ctx.closePath();ctx.fill();ctx.stroke()}
  // 頭（上から見た形。鼻先が上＝進む向き）
  ctx.translate(dx,y0-12);ctx.rotate(Math.max(-0.35,Math.min(0.35,dvx*0.06)));
  ctx.strokeStyle=INK;ctx.lineWidth=2;
  // たてがみ（左右のぎざぎざ）
  ctx.fillStyle=RED;for(const sd of [-1,1]){ctx.beginPath();ctx.moveTo(sd*14,-6);ctx.lineTo(sd*30,-2);ctx.lineTo(sd*22,6);ctx.lineTo(sd*33,12);ctx.lineTo(sd*21,16);ctx.lineTo(sd*27,26);ctx.lineTo(sd*10,22);ctx.closePath();ctx.fill();ctx.stroke()}
  // つの（後ろ向き）
  for(const sd of [-1,1]){ctx.fillStyle=GOLD;ctx.beginPath();ctx.moveTo(sd*4,12);ctx.quadraticCurveTo(sd*10,34,sd*22,44);ctx.quadraticCurveTo(sd*22,24,sd*17,10);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(sd*9,22);ctx.lineTo(sd*19,20);ctx.moveTo(sd*14,31);ctx.lineTo(sd*21,29);ctx.stroke()}
  // 頭の丸み と 鼻先
  ctx.fillStyle=RED;ctx.beginPath();ctx.ellipse(0,2,21,20,0,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,-18,14,13,0,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,-9,13,8,0,0,7);ctx.fill(); // つなぎ目の線を消す
  // ひげ（金色でくるん）
  ctx.strokeStyle=INK;ctx.lineWidth=4.5;for(const pass of [0,1]){if(pass){ctx.strokeStyle=GOLD;ctx.lineWidth=2.5}
    for(const sd of [-1,1]){ctx.beginPath();ctx.moveTo(sd*12,-20);ctx.bezierCurveTo(sd*24,-24,sd*30,-14,sd*26,-8);ctx.bezierCurveTo(sd*23,-4,sd*20,-9,sd*23,-12);ctx.stroke()}}
  ctx.strokeStyle=INK;ctx.lineWidth=2;
  // 鼻のあな
  ctx.fillStyle=INK;ctx.beginPath();ctx.ellipse(-5.5,-23,2.6,3.4,0.3,0,7);ctx.ellipse(5.5,-23,2.6,3.4,-0.3,0,7);ctx.fill();
  // 目（元の飛竜くんと同じ、白目のない黒い楕円。ぶつかった直後は ＞＜）
  if(inv>0.9){ctx.lineWidth=2.5;for(const sd of [-1,1]){ctx.beginPath();ctx.moveTo(sd*15,-11);ctx.lineTo(sd*8,-6);ctx.lineTo(sd*15,-1);ctx.stroke()}}
  else{const ex=Math.max(-1.2,Math.min(1.2,dvx*0.4));ctx.fillStyle="#1a0a08";for(const sd of [-1,1]){ctx.beginPath();ctx.ellipse(sd*10.5+ex,-6,3.6,5.2,0,0,7);ctx.fill()}}
  // まゆ毛（金色のふさふさ。上から見ると、目より後ろ＝つの側にある。内がわが目に近い、きりっとした形）
  ctx.fillStyle=GOLD;ctx.strokeStyle=INK;ctx.lineWidth=1.6;
  for(const sd of [-1,1]){ctx.beginPath();ctx.moveTo(sd*4,0);ctx.quadraticCurveTo(sd*10,11,sd*21,8);ctx.lineTo(sd*17.5,5.5);ctx.lineTo(sd*20.5,3);ctx.lineTo(sd*16,3);ctx.lineTo(sd*17,0.5);
    ctx.quadraticCurveTo(sd*10,5,sd*5.5,-2.5);ctx.closePath();ctx.fill();ctx.stroke()}
  ctx.restore()}

/* ---- 流れ ---- */
function end(){state="over";pb();$("toast").hidden=true;$("goal").hidden=true;$("lvup").hidden=true;const lv=lvOf(score);
  if(score>best){best=score;try{localStorage.setItem("tenryu-best",String(best))}catch(e){}}
  $("face").src=FACES[lv];$("msg").textContent=MSG[lv];$("res").textContent=score;$("rank").textContent=RANK[lv];
  $("detail").textContent=Math.floor(S/PX)+"m くだった／アユ "+ayu+"ひき"+(goldN?"（金 "+goldN+"）":"")+(lv<TIER.length-1?"\n"+RANK[lv+1]+"まで あと"+(TIER[lv+1]-score)+"点！":"");
  $("best").textContent="じこベスト "+best+"点";ladder();
  $("over").hidden=false}
function go(){audio();if(actx&&actx.state==="suspended")actx.resume();
  S=0;pt=0;v=150;score=0;fishPts=0;ayu=0;goldN=0;hearts=MAXH;inv=0;shake=0;sinkY=0;curLv=0;
  obs=[];fish=[];items=[];parts=[];pops=[];nextObs=H+260;nextFish=H+120;nextItem=4000;dx=rc(s2w(DY()));tx=null;trail=[];
  $("title").hidden=true;$("over").hidden=true;$("pauseCard").hidden=true;$("toast").hidden=true;$("lvup").hidden=true;
  clearTimeout(cd);cd=0;paused=false;state="play";pb();hud();beep(520,0.1)}

let last=0;
function pause(){if(state!=="play"||(paused&&!cd))return;clearTimeout(cd);cd=0;paused=true;drag=false;$("toast").hidden=true;$("pauseCard").hidden=false}
function resume(){if(!paused||cd)return;$("pauseCard").hidden=true;let n=3;const el=$("toast");clearTimeout(toast.t);
  (function tick(){if(n===0){el.hidden=true;cd=0;paused=false;return}el.textContent=n;el.hidden=false;beep(660,0.06);n--;cd=setTimeout(tick,650)})()}
function frame(now){const dt=Math.min(0.033,(now-last)/1000||0);last=now;if(!paused)step(dt);draw();requestAnimationFrame(frame)}

function px(e){const r=cv.getBoundingClientRect();return (e.clientX-r.left)/scale}
cv.addEventListener("pointerdown",e=>{if(state!=="play"||paused)return;drag=true;tx=px(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener("pointermove",e=>{if(drag&&!paused)tx=px(e)});
const up=()=>{drag=false};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){keyDir=-1;e.preventDefault()}if(e.key==="ArrowRight"){keyDir=1;e.preventDefault()}
  if(e.key==="Escape"||e.key==="p"||e.key==="P"){paused&&!cd?resume():pause()}});
addEventListener("keyup",e=>{if((e.key==="ArrowLeft"&&keyDir<0)||(e.key==="ArrowRight"&&keyDir>0))keyDir=0});
document.addEventListener("visibilitychange",()=>{if(document.hidden)pause()});
$("start").addEventListener("click",go);$("again").addEventListener("click",go);
$("pz").addEventListener("click",()=>{paused&&!cd?resume():pause()});$("resume").addEventListener("click",resume);$("restart").addEventListener("click",go);
$("snd").addEventListener("click",()=>{sound=!sound;$("snd").textContent="音"+(sound?"あり":"なし")});
ladder();hud();requestAnimationFrame(frame);
})();
</script>
