<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fff8e7">
<title>飛竜くんのゲーム</title>
<meta name="description" content="飛竜くんのミニゲーム（試作）3つの入口">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{--ink:#3a1a12;--dragon:#d8322a;--gold:#f6c343;--paper:#fff8e7;
  --display:"Dela Gothic One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:500;font-size:16px;line-height:1.6;
  padding:max(20px,env(safe-area-inset-top,0px)) 16px max(28px,env(safe-area-inset-bottom,0px))}
main{max-width:440px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
header img{width:76px;height:76px;flex:none}
h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2;margin:0;color:var(--dragon);text-wrap:balance}
.lead{margin:0 0 18px;font-size:14px;font-weight:700}
ul{list-style:none;margin:0;padding:0;display:grid;gap:16px}
a.game{display:block;text-decoration:none;color:inherit;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);overflow:hidden}
a.game:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
a.game:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.band{height:14px;border-bottom:3px solid var(--ink)}
.b1{background:#8fd3f4}.b2{background:#141a3c}.b3{background:#2f8fb8}
.in{padding:12px 16px 14px}
h2{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.25;margin:0 0 4px}
.in p{margin:0;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags span{font-size:12px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;background:var(--paper)}
.tags span.rk{background:var(--gold)}
.go{margin-top:10px;font-family:var(--display);font-size:16px;color:#fff;background:var(--dragon);border:3px solid var(--ink);border-radius:12px;padding:6px 12px;text-align:center}
footer{margin-top:22px;font-size:12px;text-align:center}
</style>
</head>

    <h1>飛竜くんのゲーム</h1>
  </header>
  <p class="lead">スマホで遊べるミニゲーム（試作）です。遊びたいゲームを押してね。</p>
  <ul>
    <li><a class="game" href="../">
      <div class="band b1"></div>
      <div class="in"><h2>のびのび飛竜くん</h2>
        <p>ごちそうを食べて体をのばし、60mの竜をめざそう。</p>
        <div class="tags"><span>指でなぞる</span><span class="rk">ランキングあり</span></div>
        <div class="go">あそぶ</div></div></a></li>
    <li><a class="game" href="../hanabi/">
      <div class="band b2"></div>
      <div class="in"><h2>花火ドーン！</h2>
        <p>打ち上げた花火を、いちばん高い所でタップして開かせよう。</p>
        <div class="tags"><span>タイミングでタップ</span><span>30秒</span></div>
        <div class="go">あそぶ</div></div></a></li>
    <li><a class="game" href="../tenryu/">
      <div class="band b3"></div>
      <div class="in"><h2>天竜川くだり</h2>
        <p>岩や流木をよけて、アユを集めながら天竜川をくだろう。</p>
        <div class="tags"><span>指で左右に動かす</span><span>ハート3つ</span></div>
        <div class="go">あそぶ</div></div></a></li>
  </ul>
