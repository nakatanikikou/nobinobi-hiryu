<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fff8e7">
<title>のびのび飛竜くん</title>
<meta name="description" content="ごちそうを食べて体をのばし、60mの竜をめざす飛竜くんのミニゲーム（試作）">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}
html{height:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 配置：上に「いまの長さ」の帯、その下いっぱいが空のあそび場。案内と結果は空の上に紙のカードで重ねる */
:root{
  --sky:#c9ecf5; --sky-deep:#86cbe0; --ink:#3a1a12; --dragon:#d8322a; --dragon-dark:#8f1a16;
  --gold:#f6c343; --paper:#fff8e7; --leaf:#3f8f4a;
  --display:"Dela Gothic One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
html,body{height:100%}
body{background:var(--sky-deep);color:var(--ink);font-family:var(--body);font-weight:500;
  display:flex;justify-content:center;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--sky)}
.hud{display:flex;align-items:center;gap:8px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--paper);border-bottom:3px solid var(--ink)}
.now{font-family:var(--display);font-size:22px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.now small{font-family:var(--body);font-weight:700;font-size:12px;margin-right:4px}
.bar{flex:1;min-width:0;height:14px;border:2px solid var(--ink);border-radius:8px;background:#fff;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:5%;background:var(--dragon);border-radius:0 6px 6px 0}
.goal{font-weight:700;font-size:12px;white-space:nowrap}
.snd{font:700 12px var(--body);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:4px 8px;white-space:nowrap}
.pz{flex:none;width:36px;height:28px;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--gold);border:2px solid var(--ink);border-radius:8px;padding:0}
.pz i{width:5px;height:13px;background:var(--ink);border-radius:2px}
.pz:disabled{opacity:.35}
.stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86%,340px);box-sizing:border-box;
  background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);
  padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.card h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin:0;color:var(--dragon);text-wrap:balance}
.card p{margin:0;font-size:15px;line-height:1.6}
.card p.legend{font-size:12px;font-weight:700;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px 10px}
.face{height:104px;width:auto}
.card p.msg{font-weight:700;font-size:19px;line-height:1.35;text-wrap:balance}
.card p.why{font-size:12px}
.big{font-family:var(--display);font-size:44px;line-height:1;color:var(--dragon);font-variant-numeric:tabular-nums}
.rank{font-weight:700;font-size:17px;background:var(--gold);border:2px solid var(--ink);border-radius:999px;padding:2px 14px}
.btn{font:400 20px var(--display);color:#fff;background:var(--dragon);border:3px solid var(--ink);border-radius:14px;
  box-shadow:0 4px 0 var(--ink);padding:10px 22px;width:100%;text-decoration:none;display:block;box-sizing:border-box}
.btn.sub{background:#fff;color:var(--ink);font-size:16px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.snd:focus-visible,.pz:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-family:var(--display);font-size:22px;
  color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:999px;padding:4px 18px;white-space:nowrap;pointer-events:none}
.card{max-height:96%;overflow-y:auto}
.card h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;margin:0;color:var(--dragon)}
.reg{width:100%;display:flex;flex-direction:column;gap:6px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px;box-sizing:border-box}
.reg .lbl{font-size:12px;font-weight:700}
.reg .row{display:flex;gap:8px}
.reg input{flex:1;min-width:0;font:700 16px var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:8px 10px}
.reg input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.btn.small{width:auto;font-size:16px;padding:6px 16px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{opacity:.5}
.card p.note{font-size:13px;font-weight:700}
.tabs{display:flex;gap:6px;width:100%}
.tab{flex:1;font:700 14px var(--body);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px}
.tab.on{background:var(--gold)}
.tab:focus-visible{outline:3px solid var(--dragon);outline-offset:2px}
.rk{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.rk li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:baseline;text-align:left;font-size:15px;padding:3px 8px;border-radius:8px}
.rk li:nth-child(odd){background:rgba(246,195,67,.25)}
.rk li b{font-family:var(--display);font-weight:400;text-align:right}
.rk li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rk li.empty{display:block;text-align:center;background:none}
</style>
</head>
<body>

<div class="app">
  <div class="hud">
    <div class="now"><small>いま</small><span id="len">3.0</span>m</div>
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    <div class="goal">めざせ60m</div>
    <button class="snd" id="snd" type="button">音あり</button>
    <button class="pz" id="pz" type="button" aria-label="一時停止" disabled><i></i><i></i></button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast" hidden></div>
    <div class="card" id="title">
      <h1>のびのび<br>飛竜くん</h1>
      <p>ごちそうを食べると体がのびるよ。<br>かみなり雲と自分の体をよけて、<br><b>60m</b>の竜をめざそう！</p>
      <p class="legend">みかん・お茶・餃子 +1m／うなぎ +2m／星 +3m</p>
      <p>画面をなぞった方向にすすむよ</p>
      <button class="btn" id="start" type="button">スタート</button>
      <button class="btn sub" id="showRank1" type="button" hidden>ランキングを見る</button>
    </div>
    <div class="card" id="rankCard" hidden>
      <h2>ランキング</h2>
      <div class="reg" id="reg" hidden>
        <p>今回の記録 <b><span id="regM">0</span>m</b> を登録できます</p>
        <label class="lbl" for="nm">名前（8文字まで・本名は入れないでね）</label>
        <div class="row"><input id="nm" maxlength="8" autocomplete="off" enterkeyhint="done"><button class="btn small" id="regBtn" type="button">登録</button></div>
      </div>
      <p class="note" id="rankNote" hidden></p>
      <div class="tabs"><button class="tab on" id="tabW" type="button">今週</button><button class="tab" id="tabA" type="button">全期間</button></div>
      <ol class="rk" id="rkList"></ol>
      <button class="btn sub" id="rankClose" type="button">とじる</button>
    </div>
    <div class="card" id="pauseCard" hidden>
      <h2>ひとやすみ中</h2>
      <p>「つづける」を押すと、<br>3つ数えてから動き出すよ</p>
      <button class="btn" id="resume" type="button">つづける</button>
      <button class="btn sub" id="restart" type="button">さいしょから</button>
    </div>

const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

function fit(){const r=stage.getBoundingClientRect(),d=window.devicePixelRatio||1;
  if(r.width<10)return;
  scale=r.width/W;H=r.height/scale;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);
  ctx.setTransform(d*scale,0,0,d*scale,0,0)}
new ResizeObserver(fit).observe(stage);fit();

function reset(){head={x:W/2,y:H*0.6,a:-Math.PI/2};path=[];
  for(let i=120;i>=0;i-=3)path.push({x:head.x,y:head.y+i});
  lenPx=targetPx=3*PXM;want=null;foods=[];parts=[];reached=false;nextMile=10;spawn();spawn()}
function spawn(gold){for(let k=0;k<30;k++){const x=30+Math.random()*(W-60),y=30+Math.random()*(H-60);
  if(Math.hypot(x-head.x,y-head.y)<90)continue;
  let ok=true;for(let i=0;i<path.length;i+=4){if(Math.hypot(x-path[i].x,y-path[i].y)<26){ok=false;break}}
  if(ok||k===29){foods.push({x,y,gold:!!gold,kind:gold?"star":pick(),born:t});return}}}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function beep(f,d){if(!sound||!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();
  o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0.08,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function toast(msg){const el=$("toast");el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},1600)}
function meters(){return targetPx/PXM}
function hud(){const m=meters();$("len").textContent=m.toFixed(1);$("fill").style.width=Math.min(100,m/GOAL*100)+"%"}

function step(dt){
  t+=dt;
  if(state==="title"){const tx=W/2+Math.cos(t*0.7)*W*0.3,ty=H/2+Math.sin(t*1.1)*H*0.3;want=Math.atan2(ty-head.y,tx-head.x)}
  if(state==="over")return;
  if(want!==null){const d=angDiff(want,head.a),m=TURN*dt;head.a+=Math.max(-m,Math.min(m,d))}
  const v=state==="title"?90:94+Math.min(meters(),GOAL)*0.96;
  head.x+=Math.cos(head.a)*v*dt;head.y+=Math.sin(head.a)*v*dt;
  path.push({x:head.x,y:head.y});
  if(lenPx<targetPx)lenPx=Math.min(targetPx,lenPx+70*dt);
  let acc=0,cut=0,hit=false;
  for(let i=path.length-1;i>0;i--){const p=path[i],q=path[i-1];acc+=Math.hypot(p.x-q.x,p.y-q.y);
    if(acc>lenPx){cut=i-1;break}
    if(acc>SAFE&&Math.hypot(q.x-head.x,q.y-head.y)<HITR)hit=true}
  if(cut>0)path.splice(0,cut);
  if(state!=="play")return;
  for(let i=foods.length-1;i>=0;i--){const f=foods[i];
    if(Math.hypot(f.x-head.x,f.y-head.y)<21){foods.splice(i,1);targetPx+=(f.gold?3:f.kind==="unagi"?2:1)*PXM;
      beep(f.gold?990:660,0.12);if(f.gold)setTimeout(()=>beep(1320,0.15),90);
      for(let k=0;k<8;k++)parts.push({x:f.x,y:f.y,vx:(Math.random()-0.5)*160,vy:(Math.random()-0.5)*160,l:0.5,c:f.gold?C.gold:"#f39a2b"});
      if(!foods.some(g=>!g.gold))spawn();
      if(!foods.some(g=>g.gold)&&Math.random()<0.22)spawn(true);
      hud();const m=meters();
      if(!reached&&m>=GOAL){reached=true;toast("60m たっせい！");beep(784,0.2);setTimeout(()=>beep(1047,0.3),180);
        if(!reduce)for(let k=0;k<60;k++)parts.push({x:W/2,y:H*0.3,vx:(Math.random()-0.5)*420,vy:(Math.random()-0.7)*420,l:1.4,c:[C.gold,C.dragon,"#fff"][k%3]})}
      else if(m>=nextMile&&nextMile<GOAL){toast(nextMile+"m こえた！");nextMile+=10}
      while(m>=nextMile)nextMile+=10}}
  for(const f of foods)if(f.gold&&t-f.born>7)f.dead=true;
  foods=foods.filter(f=>!f.dead);
  if(hit)end("自分の体にぶつかっちゃった！");
  else if(head.x<R||head.x>W-R||head.y<R||head.y>H-R)end("かみなり雲にさわっちゃった！");
}
function shareText(m,lv){const top=m>=GOAL?"🎉🐲 60m たっせい！！ 🐲🎉":"🐲✨ のびのび飛竜くん ✨🐲";
  return top+"\n\n"+"🟥".repeat(Math.max(1,Math.min(6,Math.floor(m/10))))+"🐲 ﾉﾋﾞ〜ｯ\n📏 "+m.toFixed(1)+"m までのびた！\n👑 "+RANK[lv]+"\n💬 "+MSG[lv]+"\n\n🍊🍵🥟 きみは何mまでのびる？"}
function end(why){state="over";pb();beep(180,0.35);const m=meters();lastM=m;
  const lv=Math.min(6,Math.floor(m/10));$("face").src=FACES[lv];$("msg").textContent=MSG[lv];
  if(m>best){best=m;try{localStorage.setItem("nobinobi-best",String(m))}catch(e){}}
  $("why").textContent=why;$("res").textContent=m.toFixed(1);
  const rank=RANK[lv];
  $("rank").textContent=rank;$("best").textContent="じこベスト "+best.toFixed(1)+"m";
  $("line").href="https://line.me/R/share?text="+encodeURIComponent(shareText(m,lv)+(/^https?:$/.test(location.protocol)&&!/claude|localhost/.test(location.hostname)?"\n👉 "+location.origin+location.pathname:""));
  setTimeout(()=>{$("over").hidden=false},500)}

function cloud(x,y,s){ctx.beginPath();ctx.arc(x,y,16*s,0,7);ctx.arc(x+18*s,y-8*s,20*s,0,7);ctx.arc(x+40*s,y,16*s,0,7);ctx.fill()}
function bolt(x,y,a,k){if(!reduce&&Math.sin(t*5+k*2.3)<-0.35)return;ctx.save();ctx.translate(x,y);ctx.rotate(a);
  ctx.beginPath();ctx.moveTo(-3,0);ctx.lineTo(3,0);ctx.lineTo(0.5,6);ctx.lineTo(4.5,6);ctx.lineTo(-2.5,16);ctx.lineTo(-0.5,8.5);ctx.lineTo(-4.5,8.5);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function storm(){const nx=Math.round(W/15),ny=Math.round(H/15),w=reduce?0:1.5;ctx.fillStyle="#565d6c";ctx.beginPath();
  for(let i=0;i<=nx;i++){const x=i*W/nx,b=w*Math.sin(t*2+i);ctx.moveTo(x+13+b,0);ctx.arc(x,0,13+b,0,7);ctx.moveTo(x+13-b,H);ctx.arc(x,H,13-b,0,7)}
  for(let j=0;j<=ny;j++){const y=j*H/ny,b=w*Math.sin(t*2+j*1.7);ctx.moveTo(13+b,y);ctx.arc(0,y,13+b,0,7);ctx.moveTo(W+13-b,y);ctx.arc(W,y,13-b,0,7)}
  ctx.fill();ctx.fillStyle="#f6c343";ctx.strokeStyle=C.ink;ctx.lineWidth=1.2;ctx.lineJoin="round";let k=0;
  for(let x=36;x<W-10;x+=72){bolt(x,2,0,k++);bolt(Math.min(W-14,x+36),H-2,Math.PI,k++)}
  for(let y=70;y<H-20;y+=96){bolt(2,y,-Math.PI/2,k++);bolt(W-2,y+48<H-20?y+48:y,Math.PI/2,k++)}}
function drawFood(k){ctx.strokeStyle=C.ink;ctx.lineWidth=2;
  if(k==="cha"){ctx.fillStyle="#f4efe2";ctx.beginPath();ctx.moveTo(-10,-7);ctx.lineTo(10,-7);ctx.lineTo(7,10);ctx.lineTo(-7,10);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle="#3f6fb0";ctx.fillRect(-8,1,16,3);
    ctx.fillStyle="#8fbf4d";ctx.beginPath();ctx.ellipse(0,-7,10,3.5,0,0,7);ctx.fill();ctx.stroke()}
  else if(k==="gyoza"){ctx.fillStyle="#f6e3b4";ctx.beginPath();ctx.arc(0,5,13,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle="#c8742a";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,5,8,Math.PI*1.2,Math.PI*1.8);ctx.stroke();
    ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;for(let i=-2;i<=2;i++){const a=-Math.PI/2+i*0.5;ctx.beginPath();ctx.moveTo(Math.cos(a)*13,5+Math.sin(a)*13);ctx.lineTo(Math.cos(a)*10,5+Math.sin(a)*10);ctx.stroke()}}
  else if(k==="unagi"){ctx.fillStyle="#7a1f1a";ctx.beginPath();ctx.rect(-13,-10,26,20);ctx.fill();ctx.stroke();
    ctx.fillStyle="#fff";ctx.fillRect(-10,-7,20,14);ctx.fillStyle="#9a5a22";ctx.fillRect(-9,-5,18,10);
    ctx.strokeStyle="#5c3210";ctx.lineWidth=1.5;for(let x=-5;x<=5;x+=5){ctx.beginPath();ctx.moveTo(x,-5);ctx.lineTo(x,5);ctx.stroke()}}
  else{ctx.fillStyle="#f39a2b";ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle="#3f8f4a";ctx.beginPath();ctx.ellipse(4,-10,6,3,-0.5,0,7);ctx.fill();ctx.stroke()}}
function trace(){ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y)}
function samples(){const out=[];let need=0,acc=0;
  for(let i=path.length-1;i>0;i--){const p=path[i],q=path[i-1],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<=0)continue;
    while(need<=d){const u=need/d;out.push({x:p.x+(q.x-p.x)*u,y:p.y+(q.y-p.y)*u,tx:(p.x-q.x)/d,ty:(p.y-q.y)/d,s:acc+need});need+=6}
    need-=d;acc+=d}
  return out}
function leg(p,col){const dx=-p.nx,dy=-p.ny;ctx.save();ctx.translate(p.x+dx*p.r*0.7,p.y+dy*p.r*0.7);ctx.rotate(Math.atan2(dy,dx));
  ctx.fillStyle=col;ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(6,0,9,5,0,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle="#fff";ctx.lineWidth=1;for(const c of[-3.5,0,3.5]){ctx.beginPath();ctx.moveTo(13,c-1.6);ctx.lineTo(19,c);ctx.lineTo(13,c+1.6);ctx.closePath();ctx.fill();ctx.stroke()}ctx.restore()}
function drawBody(){const S=samples(),n=S.length;if(n<2)return;const L=S[n-1].s||1;
  for(const p of S){const f=p.s/L;p.r=R*(f<0.65?1:1-(f-0.65)/0.35*0.62);let nx=-p.ty,ny=p.tx;if(ny>0){nx=-nx;ny=-ny}p.nx=nx;p.ny=ny;p.k=Math.min(1,Math.abs(ny)*1.8)}
  const e=S[n-1];ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.atan2(-e.ty,-e.tx));ctx.fillStyle="#f4a6ad";ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.lineJoin="round";
  ctx.beginPath();ctx.moveTo(-2,-3);ctx.quadraticCurveTo(8,-12,20,-3);ctx.quadraticCurveTo(12,0,20,5);ctx.quadraticCurveTo(8,10,-2,3);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  if(L>90)for(const f of[0.2,0.58])for(const off of[3,0])leg(S[Math.min(n-1,Math.round(n*f)+off)],off?C.dark:C.dragon);
  ctx.fillStyle=C.dark;ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;
  for(let i=3;i<n-2;i+=3){const p=S[i];if(p.k<0.15)continue;const b=p.r*0.7,h=p.r+(3+7*p.k)*(p.r/R);
    ctx.beginPath();ctx.moveTo(p.x+p.tx*5+p.nx*b,p.y+p.ty*5+p.ny*b);ctx.lineTo(p.x-p.tx*7+p.nx*h,p.y-p.ty*7+p.ny*h);ctx.lineTo(p.x-p.tx*5+p.nx*b,p.y-p.ty*5+p.ny*b);ctx.closePath();ctx.fill();ctx.stroke()}
  ctx.lineCap="round";ctx.lineJoin="round";
  for(const[col,ex]of[[C.ink,2],[C.dragon,0]]){ctx.strokeStyle=col;let i=1;
    ctx.lineWidth=(R+ex)*2;ctx.beginPath();ctx.moveTo(S[0].x,S[0].y);for(;i<n&&S[i].r>=R;i++)ctx.lineTo(S[i].x,S[i].y);ctx.stroke();
    for(;i<n;i++){const a=S[i-1],b=S[i];ctx.lineWidth=a.r+b.r+ex*2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
  ctx.strokeStyle=C.dark;ctx.lineWidth=1.6;ctx.beginPath();
  for(let i=2;i<n;i+=2){const p=S[i];if(p.r<6)continue;const a=Math.atan2(p.ty,p.tx),rad=p.r*0.48,qx=-p.ty,qy=p.tx;
    for(const o of((i>>1)&1?[0]:[-0.47,0.47])){const cx=p.x+qx*p.r*o,cy=p.y+qy*p.r*o;
      ctx.moveTo(cx+rad*Math.cos(a+Math.PI/2),cy+rad*Math.sin(a+Math.PI/2));ctx.arc(cx,cy,rad,a+Math.PI/2,a+Math.PI*1.5)}}
  ctx.stroke();
}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#86cbe0");g.addColorStop(1,"#dff4f8");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.55)";cloud(40,H*0.18,1.2);cloud(230,H*0.42,1);cloud(90,H*0.72,1.4);cloud(270,H*0.88,0.9);
  storm();
  for(const f of foods){const b=1+Math.sin((t-f.born)*6)*0.06;ctx.save();ctx.translate(f.x,f.y);ctx.scale(b,b);
    if(f.gold){ctx.fillStyle=C.gold;ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();
      for(let i=0;i<10;i++){const r=i%2?6:13,a=i*Math.PI/5-Math.PI/2;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke()}
    else drawFood(f.kind);
    ctx.restore()}
  drawBody();
  let near=false;for(const f of foods)if(Math.hypot(f.x-head.x,f.y-head.y)<55)near=true;
  const cs=Math.cos(head.a);if(cs>0.2)faceR=true;else if(cs<-0.2)faceR=false;
  if(headImg.complete&&headImg.naturalWidth){ctx.save();ctx.translate(head.x,head.y);
    let tilt=angDiff(faceR?head.a:Math.PI-head.a,0);tilt=Math.max(-0.6,Math.min(0.6,tilt));
    if(!faceR)ctx.scale(-1,1);ctx.rotate(tilt);
    const w=near?70:64,h=w*headImg.naturalHeight/headImg.naturalWidth;ctx.drawImage(headImg,-w*0.5,-h*0.47,w,h);ctx.restore()}
  else{
  ctx.save();ctx.translate(head.x,head.y);ctx.rotate(head.a);ctx.strokeStyle=C.ink;ctx.lineWidth=2;
  ctx.fillStyle=C.gold;for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(-8,s*9);ctx.lineTo(-20,s*20);ctx.lineTo(-1,s*14);ctx.closePath();ctx.fill();ctx.stroke()}
  ctx.fillStyle=C.dragon;ctx.beginPath();ctx.ellipse(2,0,19,16,0,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=near?C.ink:C.dark;ctx.beginPath();ctx.ellipse(15,0,near?7:3,near?9:6,0,0,7);ctx.fill();
  for(const s of[-1,1]){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(3,s*8,5.5,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(5,s*8,2.4,0,7);ctx.fill()}
  ctx.restore()}
  for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.l*2));ctx.fillStyle=p.c;ctx.fillRect(p.x-3,p.y-3,6,6)}ctx.globalAlpha=1;
}
let last=0,paused=false,cd=0;
function pb(){$("pz").disabled=state!=="play"}
function pause(){if(state!=="play"||(paused&&!cd))return;clearTimeout(cd);cd=0;paused=true;anchor=null;$("toast").hidden=true;$("pauseCard").hidden=false}
function resume(){if(!paused||cd)return;$("pauseCard").hidden=true;let n=3;const el=$("toast");clearTimeout(toast.t);
  (function tick(){if(n===0){el.hidden=true;cd=0;paused=false;return}el.textContent=n;el.hidden=false;beep(660,0.06);n--;cd=setTimeout(tick,650)})()}
function frame(now){const dt=Math.min(0.033,(now-last)/1000||0);last=now;if(!paused){step(dt);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt}parts=parts.filter(p=>p.l>0)}
  draw();requestAnimationFrame(frame)}

let anchor=null;
stage.addEventListener("pointerdown",e=>{if(state!=="play")return;anchor={x:e.clientX,y:e.clientY}});
stage.addEventListener("pointermove",e=>{if(state!=="play"||!anchor)return;const dx=e.clientX-anchor.x,dy=e.clientY-anchor.y,d=Math.hypot(dx,dy);
  if(d>10){want=Math.atan2(dy,dx);anchor.x=e.clientX-dx/d*10;anchor.y=e.clientY-dy/d*10}});
["pointerup","pointercancel","pointerleave"].forEach(n=>stage.addEventListener(n,()=>{anchor=null}));
addEventListener("keydown",e=>{if(state!=="play")return;const k={ArrowRight:0,ArrowDown:Math.PI/2,ArrowLeft:Math.PI,ArrowUp:-Math.PI/2}[e.key];
  if(k!==undefined){want=k;e.preventDefault()}});
const RANK_URL="https://script.google.com/macros/s/AKfycbzl3Y3PA7r3Rb1obslsNRkC8hTNtMmXiVypLpuhdXh__FlOOqDw-gASCA1iAaPjPMqM/exec";
let lastM=0,sent=false,rankData=null,rankTab="week",rankBack="title";
function devId(){let v="";try{v=localStorage.getItem("nobinobi-id")||""}catch(e){}
  if(!/^[a-z0-9]{8,32}$/.test(v)){v="";for(let i=0;i<16;i++)v+="abcdefghijklmnopqrstuvwxyz0123456789"[Math.floor(Math.random()*36)];try{localStorage.setItem("nobinobi-id",v)}catch(e){}}
  devId=()=>v;return v}
function note(msg){const el=$("rankNote");el.textContent=msg;el.hidden=!msg}
function renderRank(){const ol=$("rkList");ol.textContent="";$("tabW").classList.toggle("on",rankTab==="week");$("tabA").classList.toggle("on",rankTab==="all");
  const rows=rankData?(rankData[rankTab]||[]):null;
  if(!rows||!rows.length){const li=document.createElement("li");li.className="empty";li.textContent=rows?"まだ記録がありません":"よみこみ中…";ol.appendChild(li);return}
  rows.slice(0,10).forEach((r,i)=>{const li=document.createElement("li"),a=document.createElement("b"),b=document.createElement("span"),c=document.createElement("b");
    a.textContent=(i+1)+"位";b.textContent=r.n;c.textContent=Number(r.m).toFixed(1)+"m";li.append(a,b,c);ol.appendChild(li)})}
async function loadRank(){try{const r=await fetch(RANK_URL);rankData=await r.json()}catch(e){rankData={week:[],all:[]};note("ランキングを読みこめませんでした")}renderRank()}
function openRank(from){rankBack=from;$(from).hidden=true;$("rankCard").hidden=false;$("reg").hidden=!(from==="over"&&!sent&&lastM>0);
  $("regM").textContent=lastM.toFixed(1);try{if(!$("nm").value)$("nm").value=localStorage.getItem("nobinobi-name")||""}catch(e){}
  note("");rankData=null;renderRank();loadRank()}
async function register(){const name=$("nm").value.trim();if(!name){note("名前を入れてね");return}
  $("regBtn").disabled=true;note("登録中…");
  try{const r=await fetch(RANK_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name:name,m:lastM,id:devId()})}),d=await r.json();
    if(d.ok){sent=true;try{localStorage.setItem("nobinobi-name",name)}catch(e){}$("reg").hidden=true;rankData=d;renderRank();note("登録しました！ 今週 "+d.rankWeek+"位／全期間 "+d.rankAll+"位")}
    else note(d.error||"登録できませんでした")}
  catch(e){note("登録できませんでした。電波を確かめてね")}
  $("regBtn").disabled=false}
if(RANK_URL)fetch(RANK_URL).then(r=>r.json()).then(()=>{$("showRank1").hidden=false;$("showRank2").hidden=false}).catch(()=>{});
$("showRank1").addEventListener("click",()=>openRank("title"));$("showRank2").addEventListener("click",()=>openRank("over"));
$("rankClose").addEventListener("click",()=>{$("rankCard").hidden=true;$(rankBack).hidden=false});
$("tabW").addEventListener("click",()=>{rankTab="week";renderRank()});$("tabA").addEventListener("click",()=>{rankTab="all";renderRank()});
$("regBtn").addEventListener("click",register);$("nm").addEventListener("keydown",e=>{if(e.key==="Enter")register()});
function go(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  reset();hud();$("title").hidden=true;$("over").hidden=true;$("rankCard").hidden=true;$("pauseCard").hidden=true;$("toast").hidden=true;clearTimeout(cd);cd=0;paused=false;sent=false;state="play";pb();beep(520,0.1)}
$("pz").addEventListener("click",()=>{paused&&!cd?resume():pause()});$("resume").addEventListener("click",resume);$("restart").addEventListener("click",go);
addEventListener("keydown",e=>{if(e.key==="Escape"||e.key==="p"||e.key==="P"){paused&&!cd?resume():pause()}});
document.addEventListener("visibilitychange",()=>{if(document.hidden)pause()});
$("start").addEventListener("click",go);$("again").addEventListener("click",go);
$("snd").addEventListener("click",()=>{sound=!sound;$("snd").textContent="音"+(sound?"あり":"なし")});
reset();hud();requestAnimationFrame(frame);
})();
